<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="contato.css">
    <script src="contato.js" defer></script>
    <title>CONTATO|BANANA</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka&display=swap" rel="stylesheet">
</head>
<body>
    <main class="container">
        <div class="form-wrapper">
            <h1>CONTATO</h1>
            <form action="/processar" method="POST">

                <div class="form-group">
                    <input type="text" id="name" name="name" placeholder=" " required>
                    <label for="name">Nome</label>
                </div>

                <div class="form-group">
                    <input type="email" id="email" name="email" autocomplete="email" placeholder=" " required>
                    <label for="email">E-mail</label>
                </div>

                <div class="form-group">
                    <select name="assunto" id="listaAssunto" class="campoOpcao" required>
                        <option value="" disabled selected hidden></option>
                        <option value="opcao1">Banana Nanica</option>
                        <option value="opcao2">Banana Prata</option>
                        <option value="opcao3">Banana Maçã</option>
                        <option value="opcao4">Banana da Terra</option>
                    </select>
                    <label for="listaAssunto">Assunto</label>
                </div>

                <div class="form-group">
                    <textarea id="message" name="message" rows="5" cols="30" placeholder=" " required></textarea>
                    <label for="message">Mensagem</label>
                </div>

                <button type="submit">Enviar</button>

                <!-- banana decorativa-->

                 <!--<div class="olho-banana"> ● ●</div>

                <div class="boca-banana"> ︶</div>-->

            </form>
        </div>
    </main>
</body>
</html>
